[package]
name = "codex-quota-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first evidence ledger for Codex quota, usage history, and reconciliation"
readme = "README.md"
keywords = ["codex", "quota", "usage", "local-first", "observability"]
categories = ["command-line-utilities"]
publish = false

[profile.release]
strip = "symbols"
codegen-units = 1
lto = "thin"

[dependencies]
axum = "0.8.9"
jiff = "0.2.35"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread"] }
